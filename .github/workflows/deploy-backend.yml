name: Deploy Backend

on:
  push:
    branches: [dev, uat, main]
    paths:
      - "apps/backend/**"
      - "apps/worker/**"
      - "packages/shared-types/**"
      - "deploy/compose/compose.backend.yml"
      - "deploy/scripts/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Override target environment"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - dev
          - uat
          - prod

jobs:
  deploy-backend-worker:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'auto' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name == 'uat' && 'uat' || 'dev') }}
    concurrency:
      group: deploy-backend-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'auto' && github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || github.ref_name == 'uat' && 'uat' || 'dev') }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve environment and image tags
        id: vars
        run: |
          bash deploy/scripts/branch_to_env.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'auto' && github.event.inputs.environment || '' }}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.environment }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.environment }}
      - run: pnpm --filter backend prisma:migrate:deploy
      - run: pnpm --filter backend build
      - run: pnpm --filter worker build
      - name: Deploy backend and worker via SSH
        if: ${{ env.DEPLOY_SSH_HOST != '' && env.DEPLOY_SSH_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "
            set -euo pipefail
            cd \"${DEPLOY_APP_DIR:-$PWD}\"
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.image_tag }}
            export WORKER_IMAGE=ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.image_tag }}
            bash deploy/scripts/deploy_backend.sh
          "
      - name: Backend smoke checks
        if: ${{ env.BACKEND_BASE_URL != '' }}
        run: bash deploy/scripts/smoke_backend.sh
      - name: Deployment skipped notice
        if: ${{ env.DEPLOY_SSH_HOST == '' || env.DEPLOY_SSH_USER == '' || env.DEPLOY_SSH_KEY == '' }}
        run: echo "Deployment step skipped because SSH secrets are not configured for this environment."
