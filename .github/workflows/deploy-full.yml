name: Deploy Full

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  deploy-full:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-full-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
      FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tag
        id: vars
        run: |
          env_name="${{ inputs.environment }}"
          short_sha="${GITHUB_SHA:0:7}"
          echo "image_tag=${env_name}-${short_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.vars.outputs.image_tag }}
      - name: Deploy full stack via SSH
        if: ${{ env.DEPLOY_SSH_HOST != '' && env.DEPLOY_SSH_USER != '' && env.DEPLOY_SSH_KEY != '' }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "
            set -euo pipefail
            cd \"${DEPLOY_APP_DIR:-$PWD}\"
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ steps.vars.outputs.image_tag }}
            export WORKER_IMAGE=ghcr.io/${{ github.repository }}/worker:${{ steps.vars.outputs.image_tag }}
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:${{ steps.vars.outputs.image_tag }}
            bash deploy/scripts/deploy_full.sh
          "
      - name: Backend smoke checks
        if: ${{ env.BACKEND_BASE_URL != '' }}
        run: bash deploy/scripts/smoke_backend.sh
      - name: Frontend smoke checks
        if: ${{ env.FRONTEND_BASE_URL != '' }}
        run: bash deploy/scripts/smoke_frontend.sh
      - name: Deployment skipped notice
        if: ${{ env.DEPLOY_SSH_HOST == '' || env.DEPLOY_SSH_USER == '' || env.DEPLOY_SSH_KEY == '' }}
        run: echo "Deployment step skipped because SSH secrets are not configured for this environment."
